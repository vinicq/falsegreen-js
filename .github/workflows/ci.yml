name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Re-verify main once a week. Checking only on push means a floating tool can
  # break main and the badge stays green until someone happens to commit: ruff 0.16
  # widened its defaults and left falsegreen's main with 106 lint findings, unreported.
  schedule:
    - cron: "0 6 * * 1"  # Mondays at 06:00 UTC
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck / build
        run: npm run build
      - name: Test
        run: npm test
      - name: Self-scan (must not flag itself)
        run: node dist/cli.js test
